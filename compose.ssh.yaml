name: hemu-homelab

services:
  app:
    image: ${HCC_IMAGE:-hemu-hcc:local}
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    ports:
      - 127.0.0.1:${HCC_HTTP_PORT:-18000}:8000
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      HCC_DATA_DIR: /data
      HCC_CONFIG_DIR: /run/hcc
      HCC_ADMIN_PASSWORD_FILE: /run/hcc/admin.password
      HCC_ADMIN_USER: ${HCC_ADMIN_USER:-admin}
      HCC_SECURE_COOKIES: "false"
      HCC_ENABLE_SSH: "true"
      HCC_SEED_DEMO: "false"
      HCC_POLL_SECONDS: ${HCC_POLL_SECONDS:-30}
      HCC_ALLOWED_ORIGINS: ${HCC_TUNNEL_ORIGINS:-http://localhost:18000,http://127.0.0.1:18000}
    volumes:
      - ${HCC_DATA_PATH:-./data}:/data
      - ${HCC_CONFIG_PATH:-./config}:/run/hcc:ro
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
